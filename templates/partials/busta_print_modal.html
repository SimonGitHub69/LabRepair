<div class="st-busta-modal" id="bustaPrintModal" hidden
     {% if busta_return_url %}data-busta-return-url="{{ busta_return_url }}"{% endif %}>
    <div class="st-busta-dialog" role="dialog" aria-modal="true" aria-labelledby="bustaPrintTitle">
        <div class="st-busta-header">
            <h3 class="st-busta-title" id="bustaPrintTitle">Stampa busta</h3>
            <button type="button" class="btn btn-icon btn-outline-secondary" data-busta-close aria-label="Chiudi">
                <i class="ti ti-x"></i>
            </button>
        </div>
        <div class="st-busta-body">
            <div class="st-busta-status text-secondary" data-busta-status>
                Preparazione busta…
            </div>
            <div class="st-busta-preview" data-busta-preview hidden></div>
        </div>
        <div class="st-busta-footer">
            <button type="button" class="btn btn-outline-secondary" data-busta-close>Chiudi</button>
            <button type="button" class="btn btn-primary" data-busta-print hidden>
                <i class="ti ti-printer"></i>
                Stampa
            </button>
        </div>
    </div>
</div>

{% load static %}
<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Busta riparazione · {{ pratica.codice }}</title>
    <link rel="stylesheet" href="{% static 'securtek/css/busta_print.css' %}?v=20260728-gap2">
</head>
<body>
    <div class="toolbar">
        <button type="button" id="bustaPrintBtn">Stampa</button>
        <a href="{% url 'pratiche:pratica_detail' pratica.pk %}">Chiudi</a>
    </div>
    <p class="print-hint">
        Se in stampa compare l&apos;URL del sito, nella finestra di stampa togli la spunta
        <strong>Intestazioni e piè di pagina</strong>.
    </p>

    {% include "pratiche/partials/busta_sheet.html" %}

    <script>
    (function () {
        var btn = document.getElementById("bustaPrintBtn");

        function doPrint() {
            window.print();
        }

        function waitForFonts(callback) {
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    setTimeout(callback, 150);
                }).catch(function () {
                    setTimeout(callback, 300);
                });
                return;
            }
            setTimeout(callback, 300);
        }

        function waitForStylesheets(callback) {
            var links = document.querySelectorAll("link[rel='stylesheet']");
            if (!links.length) {
                callback();
                return;
            }

            var pending = links.length;
            var done = false;

            function finish() {
                pending -= 1;
                if (pending <= 0 && !done) {
                    done = true;
                    callback();
                }
            }

            links.forEach(function (link) {
                if (link.sheet) {
                    finish();
                    return;
                }
                link.addEventListener("load", finish);
                link.addEventListener("error", finish);
            });

            setTimeout(function () {
                if (!done) {
                    done = true;
                    callback();
                }
            }, 3000);
        }

        function readyPrint() {
            waitForStylesheets(function () {
                waitForFonts(doPrint);
            });
        }

        if (btn) {
            btn.addEventListener("click", readyPrint);
        }

        if (document.readyState === "complete") {
            readyPrint();
        } else {
            window.addEventListener("load", readyPrint);
        }
    })();
    </script>
</body>
</html>

<div class="st-privacy-modal" id="privacyPrintModal" hidden>
    <div class="st-privacy-dialog" role="dialog" aria-modal="true" aria-labelledby="privacyPrintTitle">
        <div class="st-privacy-header">
            <h3 class="st-privacy-title" id="privacyPrintTitle">Scheda Privacy</h3>
            <button type="button" class="btn btn-icon btn-outline-secondary" data-privacy-close aria-label="Chiudi">
                <i class="ti ti-x"></i>
            </button>
        </div>
        <div class="st-privacy-body">
            <div class="st-privacy-status text-secondary" data-privacy-status>
                Preparazione scheda…
            </div>
            <div class="st-privacy-preview" data-privacy-preview hidden></div>
        </div>
        <div class="st-privacy-footer">
            <button type="button" class="btn btn-outline-secondary" data-privacy-close>Chiudi</button>
            <a class="btn btn-outline-secondary" data-privacy-download hidden download>Scarica PDF</a>
            <button type="button" class="btn btn-primary" data-privacy-print hidden>
                <i class="ti ti-printer"></i>
                Stampa
            </button>
        </div>
    </div>
</div>
